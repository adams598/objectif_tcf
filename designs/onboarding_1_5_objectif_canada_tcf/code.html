<style>

<body class="bg-slate-50 min-h-screen flex flex-col items-center justify-center font-sans text-on-surface">
<div class="w-full max-w-container-max mx-auto px-4 md:px-10 flex flex-col h-screen max-h-[800px]">
<!-- Progress Bar -->
<div class="w-full max-w-2xl mx-auto pt-10 pb-6">
<div class="flex justify-between items-center mb-2">
<span class="font-label-sm text-label-sm text-on-surface-variant uppercase tracking-wider">Étape 1 sur 5</span>
<span class="font-label-sm text-label-sm text-primary font-bold">Définition de l'objectif</span>
</div>
<div class="h-2 w-full bg-surface-variant rounded-full overflow-hidden">
<div class="h-full bg-primary rounded-full" style="width: 20%;"></div>
</div>
</div>
<!-- Main Content -->
<main class="flex-grow flex flex-col items-center justify-center w-full max-w-2xl mx-auto">
<div class="text-center mb-10">
<h1 class="font-display-md text-display-md text-on-surface mb-4">Quel est votre objectif principal au Canada ?</h1>
<p class="font-body-lg text-body-lg text-on-surface-variant">Cela nous aidera à personnaliser votre parcours de préparation au test.</p>
</div>
<!-- Options Grid -->
<div class="grid grid-cols-1 md:grid-cols-3 gap-md w-full mb-12">
<!-- Option 1: Résidence Permanente -->
<button class="flex flex-col items-center text-center p-xl bg-surface border border-surface-variant rounded-xl hover:border-primary transition-all duration-200 group focus:outline-none card-active" id="btn-rp">
<div class="w-16 h-16 rounded-full bg-surface-container flex items-center justify-center mb-4 group-hover:bg-primary-container transition-colors duration-200 text-primary">
<span class="material-symbols-outlined" data-weight="fill" style="font-size: 32px;">home_work</span>
</div>
<h3 class="font-headline-lg-mobile text-headline-lg-mobile text-on-surface mb-2">Résidence Permanente</h3>
<p class="font-body-md text-body-md text-on-surface-variant">Immigrer et s'installer durablement au Canada.</p>
</button>
<!-- Option 2: Études -->
<button class="flex flex-col items-center text-center p-xl bg-surface border border-surface-variant rounded-xl hover:border-primary transition-all duration-200 group focus:outline-none" id="btn-etudes">
<div class="w-16 h-16 rounded-full bg-surface-container flex items-center justify-center mb-4 group-hover:bg-primary-container transition-colors duration-200 text-on-surface-variant group-hover:text-primary">
<span class="material-symbols-outlined" style="font-size: 32px;">school</span>
</div>
<h3 class="font-headline-lg-mobile text-headline-lg-mobile text-on-surface mb-2">Études</h3>
<p class="font-body-md text-body-md text-on-surface-variant">Poursuivre des études supérieures dans une institution canadienne.</p>
</button>
<!-- Option 3: Travail -->
<button class="flex flex-col items-center text-center p-xl bg-surface border border-surface-variant rounded-xl hover:border-primary transition-all duration-200 group focus:outline-none" id="btn-travail">
<div class="w-16 h-16 rounded-full bg-surface-container flex items-center justify-center mb-4 group-hover:bg-primary-container transition-colors duration-200 text-on-surface-variant group-hover:text-primary">
<span class="material-symbols-outlined" style="font-size: 32px;">work</span>
</div>
<h3 class="font-headline-lg-mobile text-headline-lg-mobile text-on-surface mb-2">Travail</h3>
<p class="font-body-md text-body-md text-on-surface-variant">Obtenir un permis de travail ou faire avancer sa carrière.</p>
</button>
</div>
<!-- Action Button -->
<div class="w-full flex justify-end">
<button class="gradient-bg text-on-primary font-label-md text-label-md px-8 py-4 rounded-xl shadow-sm hover:opacity-90 transition-opacity focus:outline-none focus:ring-2 focus:ring-primary focus:ring-offset-2 flex items-center gap-2">
                    Suivant
                    <span class="material-symbols-outlined" style="font-size: 20px;">arrow_forward</span>
</button>
</div>
</main>
</div>
<script>
        // Simple interaction for selecting an option
        const buttons = [document.getElementById('btn-rp'), document.getElementById('btn-etudes'), document.getElementById('btn-travail')];
        
        buttons.forEach(btn => {
            if(btn) {
                btn.addEventListener('click', () => {
                    // Remove active class from all
                    buttons.forEach(b => {
                        b.classList.remove('card-active');
                        const iconContainer = b.querySelector('div.rounded-full');
                        iconContainer.classList.remove('bg-primary-container', 'text-primary');
                        iconContainer.classList.add('bg-surface-container', 'text-on-surface-variant');
                        const icon = b.querySelector('.material-symbols-outlined');
                        icon.removeAttribute('data-weight');
                        icon.style.fontVariationSettings = "'FILL' 0";
                    });

                    // Add active class to clicked
                    btn.classList.add('card-active');
                    const iconContainer = btn.querySelector('div.rounded-full');
                    iconContainer.classList.remove('bg-surface-container', 'text-on-surface-variant');
                    iconContainer.classList.add('bg-primary-container', 'text-primary');
                    const icon = btn.querySelector('.material-symbols-outlined');
                    icon.setAttribute('data-weight', 'fill');
                    icon.style.fontVariationSettings = "'FILL' 1";
                });
            }
        });
    </script>
